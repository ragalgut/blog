---
layout: default
---
<article class="site-shell page-layout">
  <header class="page-heading">
    {% if page.eyebrow %}<p class="home-eyebrow">{{ page.eyebrow | escape }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title | escape }}</h1>
    {% if page.intro %}<p class="page-lead">{{ page.intro | escape }}</p>{% endif %}
  </header>
  {{ content }}
</article>
