<section class="site-shell comments" aria-labelledby="comments-title">
  <div class="prose">
    <h2 id="comments-title">Conversamos</h2>
    {% if jekyll.environment == 'production' %}
    <p>Los comentarios se cargan desde Disqus cuando los abres.</p>
    <button class="button" type="button" data-comments data-shortname="{{ site.disqus_shortname | escape }}" data-url="{{ page.url | absolute_url }}" data-identifier="{{ page.url | escape }}" hidden>Ver comentarios</button>
    <div id="disqus_thread"></div>
    <noscript><p>Activa JavaScript para cargar los comentarios.</p></noscript>
    {% else %}
    <p>Los comentarios estarán disponibles en la web publicada.</p>
    {% endif %}
  </div>
</section>
