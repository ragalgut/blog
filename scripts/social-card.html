<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagen para compartir ragalgut.me</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .social-card { position: relative; width: 1200px; height: 630px; padding: 64px 80px; overflow: hidden; color: #171b22; background: #fff; }
  .name { margin: 0 0 20px; font-size: 18px; line-height: 1.4; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #626b79; }
  .wordmark { margin: 0; font-size: 88px; line-height: 1; font-weight: 500; letter-spacing: -5px; }
  .wordmark span { color: #0067d9; }
  h1 { margin: 64px 0 0; font-size: 62px; line-height: 1.12; font-weight: 500; letter-spacing: -2.6px; }
  .portrait { position: absolute; top: 210px; right: 80px; width: 222px; height: 222px; padding: 10px; border-radius: 50%; background: #eaf3ff; }
  .portrait img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  footer { position: absolute; left: 80px; right: 80px; bottom: 58px; display: flex; justify-content: space-between; align-items: center; gap: 30px; padding-top: 24px; border-top: 1px solid #e6eaf0; font-size: 20px; line-height: 1.5; color: #626b79; }
  footer p { margin: 0; }
  footer span { color: #0067d9; }
</style>
<main class="social-card">
  <p class="name">Rafael Galante Gutiérrez</p>
  <p class="wordmark">ragalgut<span>.me</span></p>
  <h1>Cloud, código<br>y proyectos reales.</h1>
  <div class="portrait"><img src="/images/profile-ragalgut.jpeg" alt="Rafael Galante Gutiérrez" width="202" height="202"></div>
  <footer><p>Azure · Automatización · WordPress</p><span>ragalgut.me</span></footer>
</main>
</html>
