title: ragalgut.me
description: Artículos y proyectos de Rafael Galante sobre Azure, Terraform, automatización y desarrollo web. Experiencias de un arquitecto de soluciones cloud.
lang: es
url: "https://ragalgut.me"
baseurl: ""

author:
  name: Rafael Galante Gutiérrez
  bio: arquitecto de soluciones cloud en Kyndryl
  avatar: /images/profile-ragalgut.jpeg

social:
  - label: GitHub
    url: https://github.com/ragalgut
  - label: LinkedIn
    url: https://www.linkedin.com/in/ragalgut/
  - label: X
    url: https://twitter.com/ragalgut

disqus_shortname: ragalgut
google_analytics: G-Q1F6XGNYW1

markdown: kramdown
kramdown:
  toc_levels: '2..3'
highlighter: rouge
permalink: /:title
collections:
  projects:
    output: true
    permalink: /proyectos/:name/
plugins:
  - jekyll-sitemap
  - jekyll-feed

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - tests
  - vendor
  - .bundle

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
    values:
      image: /images/profile-ragalgut.jpeg
      image_alt: Rafael Galante Gutiérrez, arquitecto de soluciones cloud

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: development

feed:
  posts_limit: 20
