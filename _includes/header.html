<header class="site-header site-shell" id="top">
  <a class="site-wordmark" href="{{ '/' | relative_url }}" aria-label="ragalgut.me, inicio">ragalgut<span>.me</span></a>

  <nav class="site-nav" aria-label="Navegación principal">
    <a{% if page.article_archive %} class="site-nav__active" aria-current="page"{% endif %} href="{{ '/articulos/' | relative_url }}">Artículos</a>
    <a{% if page.url == '/proyectos/' %} class="site-nav__active" aria-current="page"{% elsif page.layout == 'project' %} class="site-nav__active"{% endif %} href="{{ '/proyectos/' | relative_url }}">Proyectos</a>
    <a{% if page.url == '/acerca-de/' %} class="site-nav__active" aria-current="page"{% endif %} href="{{ '/acerca-de/' | relative_url }}">Acerca de</a>
    <details class="site-tools">
      <summary>Herramientas <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="site-tools__menu">
        <a{% if page.url == '/herramientas/' %} aria-current="page"{% endif %} href="{{ '/herramientas/' | relative_url }}">Ver todas las herramientas</a>
        {% for tool in site.data.tools %}<a{% if page.tool_id == tool.id %} aria-current="page"{% endif %} href="{{ tool.url | relative_url }}">{{ tool.title }}</a>{% endfor %}
      </div>
    </details>
  </nav>

  <div class="site-controls">

    <button class="toggle-theme icon-button" type="button" hidden aria-label="Activar modo oscuro" aria-pressed="false">
      <svg class="theme-icon__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A8.7 8.7 0 0 1 10.7 3.1a8.7 8.7 0 1 0 10.2 10.2Z"/></svg>
      <svg class="theme-icon__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-button search-button" data-search-open hidden type="button" aria-label="Buscar artículos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
    </button>
  </div>
</header>

{% include search.html %}
