<footer class="site-footer site-shell">
  <div><a class="site-footer__brand" href="{{ '/' | relative_url }}">ragalgut<span>.me</span></a> · {{ site.author.name }}</div>
  <div class="site-footer__links">
    {% assign contact = site.social | where: 'label', 'LinkedIn' | first %}
    {% if contact %}<a href="{{ contact.url }}">Contactar por LinkedIn <span aria-hidden="true">↗</span></a>{% endif %}
    <a href="{{ '/tags/' | relative_url }}">Temas</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS <span aria-hidden="true">↗</span></a>
    <a class="back-to-top" href="#top">Volver arriba <span aria-hidden="true">↑</span></a>
  </div>
</footer>
